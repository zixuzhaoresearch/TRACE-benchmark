[project]
name = "trace-benchmark"
version = "1.0.0"
description = "TRACE: Tourism Recommendation with Accountable Citation Evidence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
keywords = ["conversational-recommendation", "tourism", "benchmark", "citation", "grounding"]

dependencies = [
    "dspy>=3.0",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.50",
    "openai>=1.40",
]
neural = [
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
]
all = [
    "trace-benchmark[llm,neural]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trace_kit*"]
